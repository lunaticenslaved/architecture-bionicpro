# Nginx CDN — reverse proxy с кэшированием статических файлов отчётов.
#
# Архитектура:
#   Клиент → Nginx (порт 8083) → Minio (порт 9000)
#
# Кэш хранится локально в /var/cache/nginx/reports и живёт 1 час
# (соответствует Cache-Control: max-age=3600, который ставит reports-api).
#
# Инвалидация кеша:
#   1) reports-api удаляет объект из S3 (DELETE /reports/cache).
#   2) Nginx автоматически перестанет отдавать закэшированный файл
#      после истечения max-age; для принудительной инвалидации можно
#      использовать nginx -s reload или удалить файлы из кэш-директории.
#   3) Для production рекомендуется использовать CDN с API purge
#      (CloudFront, Cloudflare и т.п.).

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Зона кэширования: имя, максимальный размер, неактивное время.
    # inactive=60m — удалять из кэша файлы, к которым не обращались 1 час.
    proxy_cache_path /var/cache/nginx/reports
                     levels=1:2
                     keys_zone=reports_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # Upstream — Minio S3-совместимое хранилище.
    upstream minio_backend {
        server minio:9000;
    }

    server {
        listen 8083;
        server_name localhost;

        # Основной location: все запросы к /bionicpro-reports/*
        # проксируются в Minio с кэшированием.
        location /bionicpro-reports/ {

            # Используем зону кэширования.
            proxy_cache reports_cache;

            # Ключ кэша: уникальный для каждого URL запроса.
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # Время жизни кэша по статусу ответа:
            #   200 — 1 час (соответствует Cache-Control от reports-api)
            #   404 — 1 минута (не закэшировать отсутствующие файлы надолго)
            #   500 — не кэшировать
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 500 0;

            # Добавляем заголовок X-Cache-Status: HIT/MISS/BYPASS/EXPIRED
            # для отладки и мониторинга эффективности кэша.
            add_header X-Cache-Status $upstream_cache_status;

            # Пробрасываем запрос в Minio.
            # Minio ожидает запрос вида GET /{bucket}/{key}.
            proxy_pass http://minio_backend;

            # Безопасные заголовки прокси.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Прозрачная передача Content-Type и Cache-Control от Minio.
            proxy_pass_header Content-Type;
            proxy_pass_header Content-Disposition;
            proxy_pass_header Cache-Control;

            # Таймауты для больших файлов.
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Разрешить CORS для фронтенда (если нужен прямой доступ).
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        }

        # Health check endpoint.
        location /health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }
    }
}
